<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIKA - form mahasiswa</title>
    <link rel="stylesheet" href="index.css">
    <script src="assets/js/app.js"></script>
</head>

<body>
    <header>
        <h1>SIKA</h1>
        <P>sistem informasi akademik</P>
    </header>
    <nav aria-label="Navigasi utama">
        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="mahasiswa.html">profil mahasiswa</a></li>
            <li><a href="form-mahasiswa.html">form mahasiswa</a></li>
        </ul>
    </nav>
    <main>
        <section class="dashboard-grid">
            <article class="card">
                <h2>Mahasiswa</h2>
                <p>Kelola data mahasiswa.</p>
            </article>
            <article class="card">
                <h2>Mata Kuliah</h2>
                <p>Informasi mata kuliah.</p>
            </article>
            <article class="card">
                <h2>KRS</h2>
                <p>Rencana studi mahasiswa.</p>
            </article>
        </section>
        <h1>form data mahasiswa</h1>
        <form action="#" method="post">
            <div>
                <label for="nim">NIM</label>
                <input type="text">
            </div>
            <div>
                <label for="nama">nama lengkap</label>
                <input type="text">

            </div>
            <div>
                <label for="email">Email</label>
                <input type="email">

            </div>
            <div>
                <label for="prodi">program studi</label>
                <select id="prodi" name="prodi" required>
                    <option value="">-- pilih --</option>
                    <option value="IT">teknik informatika</option>
                    <option value="SI">Sistem informasi</option>
                </select>
            </div>
            <div>
                <label for="angkatan">angkatan</label>
                <input type="number">

            </div>
            <fieldset>
                <legend>status akademik</legend>
                <input type="radio">

                <label for="aktif">aktif</label>
                <input type="radio">
                <label for="nonaktif">nonktif</label>
            </fieldset>
            <button type="submit">simpan</button>
            <button type="reset">reset</button>
        </form>
    </main>
    <footer>
        <p>&copy;2026 SIKA</p>
    </footer>
</body>

</html>
